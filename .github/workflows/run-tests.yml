name: Run Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  laravel-breeze-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sisfota_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create Database
      run: |
        touch database/database.sqlite
      # Alternatively using MySQL usage below if configured in .env.testing
      # But standard laravel tests usually run on sqlite or allow overriding via env. 
      # For simplicity in this workflow without creating a dedicated .env.testing with mysql credentials, 
      # we can stick to sqlite if the project supports it, OR configure env vars to use the service.
    
    - name: Configure Environment (Use SQLite for testing speed/simplicity or MySQL Service)
      run: |
        echo "DB_CONNECTION=sqlite" >> .env
        echo "DB_DATABASE={{ github.workspace }}/database/database.sqlite" >> .env
        # If MySQL is preferred:
        # echo "DB_CONNECTION=mysql" >> .env
        # echo "DB_HOST=127.0.0.1" >> .env
        # echo "DB_PORT=3306" >> .env
        # echo "DB_DATABASE=sisfota_test" >> .env
        # echo "DB_USERNAME=root" >> .env
        # echo "DB_PASSWORD=password" >> .env

    - name: Run Migrations
      run: php artisan migrate --force

    - name: Execute Tests (Pest)
      run: ./vendor/bin/pest
